worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # WSTG-INFO-02: exact version disclosed in Server header and error pages
    server_tokens on;

    # WSTG-CONF-02: directory listing enabled platform-wide
    autoindex on;

    # WSTG-CONF-13: duplicate slashes are not merged, so //admin and /admin differ
    merge_slashes off;

    sendfile on;
    access_log /var/log/nginx/access.log;

    # WSTG-CONF-14: no X-Content-Type-Options / X-Frame-Options / Referrer-Policy /
    # Permissions-Policy / COOP / COEP / CORP anywhere in this vhost.

    upstream portal_app { server app:5000; }

    server {
        listen 80 default_server;
        server_name portal.lab.test;
        root /srv/www;
        index index.html;

        # WSTG-CONF-03 / CONF-04: dotfiles, source and backup artefacts are served.
        location ~ /\. {
            allow all;
            autoindex on;
            default_type text/plain;
        }
        location ~* \.(bak|old|save|orig|dist|inc|sql|swp|tgz|zip|tar\.gz)$ {
            default_type text/plain;
            autoindex on;
        }
        # editor backup suffix (index.php~) is not a dot-extension, so it needs
        # its own rule to be served as text.
        location ~ ~$ {
            default_type text/plain;
        }

        # WSTG-CONF-13: alias with a trailing slash but a location prefix without one.
        # /static../secret/flag.txt resolves outside the intended static root.
        location /static {
            alias /srv/www/static/;
            autoindex on;
        }

        # WSTG-CONF-05: the admin area is "protected" at the proxy ...
        # (trailing slash matters: a bare /admin prefix would also deny
        #  /admin-backup/, which is a separate CONF-04 artefact)
        location /admin/ {
            deny all;
        }

        # ... but WSTG-CONF-13: this prefix has no trailing slash and proxy_pass
        # carries a URI, so /apiadmin/users is forwarded as /admin/users.
        location /api {
            proxy_pass http://portal_app/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Original-URI $request_uri;
        }

        # WSTG-CONF-06: unauthenticated WebDAV write/delete on the web root.
        location /files/ {
            dav_methods PUT DELETE MKCOL COPY MOVE;
            create_full_put_path on;
            dav_access user:rw group:rw all:rw;
            autoindex on;
        }

        location / {
            try_files $uri $uri/ @app;
        }
        location @app {
            proxy_pass http://portal_app;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # WSTG-CONF-07: TLS is offered but Strict-Transport-Security is never sent,
    # and the port-80 vhost above serves the app instead of redirecting to HTTPS.
    server {
        listen 443 ssl;
        server_name portal.lab.test;
        root /srv/www;
        index index.html;

        ssl_certificate     /etc/nginx/tls/portal.crt;
        ssl_certificate_key /etc/nginx/tls/portal.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        autoindex on;
        location / { try_files $uri $uri/ @app_tls; }
        location @app_tls {
            proxy_pass http://portal_app;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        }
    }

    # WSTG-CONF-05: infrastructure admin interface left reachable.
    server {
        listen 8080;
        server_name _;
        location /nginx_status {
            stub_status;
            allow all;
        }
        location / {
            return 200 "wstg-m01 front status vhost\n";
            default_type text/plain;
        }
    }
}