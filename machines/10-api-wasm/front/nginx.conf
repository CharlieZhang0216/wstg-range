server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # wasm + disguised module + leaked source are served as static files
    location / {
        try_files $uri $uri/ =404;
    }

    # everything API-shaped goes to the Flask platform
    location ~ ^/(api/|v1/|v2/|graphql|openapi\.json|swagger/|webhooks/|debug/|\.well-known/) {
        proxy_pass http://api:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}