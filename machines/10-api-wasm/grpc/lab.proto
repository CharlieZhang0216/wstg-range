syntax = "proto3";

package lab;

// Acme inventory service - intentionally vulnerable (WSTG-APIT-10).
// Reflection is enabled, the channel is plaintext h2c with no auth, and the
// Admin* RPCs skip the token check that the regular RPCs enforce.
service Inventory {
  rpc GetItem (ItemRequest) returns (Item);
  rpc ListItems (ListRequest) returns (ItemList);
  rpc AdminDumpUsers (DumpRequest) returns (UserDump);
  rpc AdminSetStock (SetStockRequest) returns (Item);
}

message ItemRequest { int32 id = 1; }
message ListRequest {}
message DumpRequest {}
message SetStockRequest { int32 id = 1; int32 stock = 2; }

message Item {
  int32 id = 1;
  string name = 2;
  int32 stock = 3;
  string internal_note = 4;
}

message ItemList { repeated Item items = 1; }

message UserRecord {
  int32 id = 1;
  string username = 2;
  string password_hash = 3;
  string api_token = 4;
  bool is_admin = 5;
}

message UserDump { repeated UserRecord users = 1; }