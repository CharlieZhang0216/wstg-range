name: wstg-m07

# Intentionally vulnerable training target. Loopback-only publishing.
# See ../../CONVENTIONS.md and README.md before running.
#
# Proxy note: some Docker Desktop / OrbStack setups inject a host-side proxy
# (e.g. 127.0.0.1:7890) from ~/.docker/config.json into every container, which
# is unreachable from inside the container and breaks all build-time downloads.
# These anchors blank it by default (direct egress). If your network genuinely
# requires a proxy, export LAB_HTTP_PROXY=http://your-proxy:port before building.

x-proxy-args: &proxy-args
  HTTP_PROXY: "${LAB_HTTP_PROXY:-}"
  HTTPS_PROXY: "${LAB_HTTP_PROXY:-}"
  http_proxy: "${LAB_HTTP_PROXY:-}"
  https_proxy: "${LAB_HTTP_PROXY:-}"

x-proxy-env: &proxy-env
  HTTP_PROXY: ""
  HTTPS_PROXY: ""
  http_proxy: ""
  https_proxy: ""
  NO_PROXY: "*"
  no_proxy: "*"

services:
  app:
    build:
      context: ./app
      args:
        <<: *proxy-args
    image: wstg-m07-app:local
    container_name: wstg-m07-app
    networks: [edge]
    environment:
      <<: *proxy-env
    ports:
      - "127.0.0.1:8700:5000"   # main portal: HTTP only, padding oracle, weak crypto, errors
    restart: "no"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  tls:
    build:
      context: ./tls
      args:
        <<: *proxy-args
    image: wstg-m07-tls:local
    container_name: wstg-m07-tls
    networks: [edge]
    environment:
      <<: *proxy-env
    ports:
      - "127.0.0.1:8743:8443"   # weak TLS: TLSv1+, SECLEVEL=0, bad cert, no HSTS
    restart: "no"
    healthcheck:
      test: ["CMD", "python", "-c", 'import ssl,socket;ctx=ssl.SSLContext(ssl.PROTOCOL_TLS_CLIENT);ctx.check_hostname=False;ctx.verify_mode=ssl.CERT_NONE;ctx.set_ciphers("ALL:@SECLEVEL=0");s=ctx.wrap_socket(socket.create_connection(("127.0.0.1",8443),timeout=3),server_hostname="127.0.0.1");s.sendall(b"GET /health HTTP/1.0\r\n\r\n");assert b"200" in s.recv(4096)']
      interval: 5s
      timeout: 5s
      retries: 20

  node:
    build:
      context: ./node
      args:
        <<: *proxy-args
    image: wstg-m07-node:local
    container_name: wstg-m07-node
    networks: [edge]
    environment:
      <<: *proxy-env
    ports:
      - "127.0.0.1:8705:5000"   # Express dev mode: full stack traces on unhandled errors
    restart: "no"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  telnet:
    image: python:3.12-slim
    container_name: wstg-m07-telnet
    networks: [edge]
    environment:
      <<: *proxy-env
    ports:
      - "127.0.0.1:8723:8723"   # cleartext maintenance console: creds + token on the wire
    volumes:
      - ./telnet/server.py:/srv/server.py:ro
    command: ["python", "/srv/server.py"]
    restart: "no"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket;s=socket.create_connection(('127.0.0.1',8723),timeout=3);assert b'login:' in s.recv(4096)"]
      interval: 5s
      timeout: 5s
      retries: 20

networks:
  edge:
    driver: bridge