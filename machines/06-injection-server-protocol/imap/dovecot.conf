protocols = imap
listen = *
ssl = no
disable_plaintext_auth = no
auth_mechanisms = plain login
log_path = /dev/stderr
info_log_path = /dev/stderr
debug_log_path = /dev/stderr

passdb {
  driver = static
  args = password=Password123!
}

userdb {
  driver = static
  args = uid=1000 gid=1000 home=/var/mail/vuser
}

mail_location = maildir:/var/mail/vuser/Maildir

namespace inbox {
  inbox = yes
  separator = /
}

service imap-login {
  inet_listener imap {
    port = 143
  }
}