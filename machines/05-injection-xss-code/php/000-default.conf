<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    ErrorLog ${APACHE_LOG_DIR}/error.log
    # WSTG-INJT-11.1: a real on-disk access log (the stock image symlinks
    # access.log to /dev/stdout). page.php can include() this file, so a PHP
    # payload placed in the User-Agent is executed -> log poisoning.
    CustomLog /var/log/apache2/lab-access.log combined

    <Directory /var/www/html>
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>