worker_processes 1;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events { worker_connections 256; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;
    sendfile      on;
    server_tokens on;

    # WSTG-INJT-03: a WAF-style filter that only inspects GET. The same payload
    # in a POST body (or any other verb) is never looked at.
    map "$request_method:$arg_q" $waf_block {
        default              0;
        "~*^GET:.*(<|%3C)script"  1;
    }

    upstream app_up    { server app:5000; }
    upstream apache_up { server apache:80; }
    upstream php_up    { server php:80; }
    upstream node_up   { server node:3000; }

    server {
        listen 80;
        server_name portal.lab.test;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;

        # WSTG-INJT-01: reflected XSS, three output contexts.
        location /search {
            if ($waf_block) { return 403 "blocked by GET-only WAF\n"; }
            proxy_pass http://app_up;
        }

        # WSTG-INJT-04: the front layer authorises on the FIRST occurrence of
        # "role" ($arg_role), while the backend handler uses the LAST one.
        # ?role=admin            -> 403 here
        # ?role=user&role=admin  -> passes here, backend sees "admin"
        location /hpp/admin {
            if ($arg_role = "admin") { return 403 "role=admin denied by front layer\n"; }
            proxy_pass http://app_up;
        }

        location /ssi/   { proxy_pass http://apache_up/; }
        location /php/   { proxy_pass http://php_up/; }
        location /proto/ { proxy_pass http://node_up/; }

        location / { proxy_pass http://app_up; }
    }
}