name: wstg-m04

# Intentionally vulnerable training target. Loopback-only publishing.
# See ../../CONVENTIONS.md and README.md before running.
#
# Proxy note: some Docker Desktop / OrbStack setups inject a host-side proxy
# (e.g. 127.0.0.1:7890) from ~/.docker/config.json into every container, which
# is unreachable from inside the container and breaks all build-time downloads.
# These anchors blank it by default (direct egress). If your network genuinely
# requires a proxy, export LAB_HTTP_PROXY=http://your-proxy:port before building.

x-proxy-args: &proxy-args
  HTTP_PROXY: "${LAB_HTTP_PROXY:-}"
  HTTPS_PROXY: "${LAB_HTTP_PROXY:-}"
  http_proxy: "${LAB_HTTP_PROXY:-}"
  https_proxy: "${LAB_HTTP_PROXY:-}"

x-proxy-env: &proxy-env
  HTTP_PROXY: ""
  HTTPS_PROXY: ""
  http_proxy: ""
  https_proxy: ""
  NO_PROXY: "*"
  no_proxy: "*"

services:
  app:
    build:
      context: ./app
      args:
        <<: *proxy-args
    image: wstg-m04-app:local
    container_name: wstg-m04-app
    networks: [edge, backend]
    environment:
      <<: *proxy-env
      MYSQL_HOST: mysql
      PG_HOST: postgres
      MONGO_HOST: mongo
      LDAP_HOST: ldap
      LDAP_PORT: "1389"
      MSSQL_HOST: mssql
      MSSQL_SA_PASSWORD: "Str0ngP@ssw0rd!"
    ports:
      - "127.0.0.1:8400:5000"   # primary vulnerable front application
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      ldap:
        condition: service_healthy
      mssql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 5s
      timeout: 5s
      retries: 30

  jsonfront:
    build:
      context: ./jsonfront
      args:
        <<: *proxy-args
    image: wstg-m04-jsonfront:local
    container_name: wstg-m04-jsonfront
    networks: [edge, backend]
    environment:
      <<: *proxy-env
      BACKEND_URL: "http://app:5000/json/backend"
    ports:
      - "127.0.0.1:8401:5000"   # INJT-26 first-wins JSON validator/proxy
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  mysql:
    image: mysql:8.4
    container_name: wstg-m04-mysql
    networks: [backend]
    environment:
      <<: *proxy-env
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: shop
      MYSQL_USER: webapp
      MYSQL_PASSWORD: webapppass
    command: ["--secure-file-priv=", "--local-infile=1"]
    volumes:
      - ./db/mysql-init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpass", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 40

  postgres:
    image: postgres:16-alpine
    container_name: wstg-m04-postgres
    networks: [backend]
    environment:
      <<: *proxy-env
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pgroot
      POSTGRES_DB: webapp
    volumes:
      - ./db/pg-init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d webapp"]
      interval: 5s
      timeout: 3s
      retries: 20

  mongo:
    image: mongo:7
    container_name: wstg-m04-mongo
    networks: [backend]
    environment:
      <<: *proxy-env
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpass
      MONGO_INITDB_DATABASE: lab
    volumes:
      - ./db/mongo-init.js:/docker-entrypoint-initdb.d/10-init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "-u", "root", "-p", "rootpass",
             "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 30

  ldap:
    image: bitnamilegacy/openldap:2.6
    container_name: wstg-m04-ldap
    networks: [backend]
    environment:
      <<: *proxy-env
      LDAP_ROOT: "dc=lab,dc=local"
      LDAP_ADMIN_USERNAME: admin
      LDAP_ADMIN_PASSWORD: adminpass
      LDAP_PORT_NUMBER: "1389"
      LDAP_SKIP_DEFAULT_TREE: "yes"
    healthcheck:
      test: ["CMD-SHELL", "ldapsearch -x -H ldap://127.0.0.1:1389 -D cn=admin,dc=lab,dc=local -w adminpass -b '' -s base '(objectClass=*)' namingContexts"]
      interval: 5s
      timeout: 5s
      retries: 30

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64        # no arm64 build; Rosetta/qemu emulation
    container_name: wstg-m04-mssql
    networks: [backend]
    environment:
      <<: *proxy-env
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Str0ngP@ssw0rd!"
      MSSQL_PID: Developer
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S 127.0.0.1 -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -l 3 || /opt/mssql-tools/bin/sqlcmd -S 127.0.0.1 -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -l 3"]
      interval: 5s
      timeout: 10s
      retries: 60

networks:
  edge:
    driver: bridge
  backend:
    driver: bridge
    internal: true